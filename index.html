<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000" id="tc">
<title>Ритм</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#000000; --text:#f2f2f2; --accent:#ff3b3b; --accent-ink:#ffffff;
  --inc:#3ddc84; --exp:#ff7a6e;
  --surface:color-mix(in srgb,var(--text) 7%,var(--bg));
  --surface2:color-mix(in srgb,var(--text) 13%,var(--bg));
  --line:color-mix(in srgb,var(--text) 15%,transparent);
  --muted:color-mix(in srgb,var(--text) 55%,var(--bg));
  --dot:'Doto','JetBrains Mono',ui-monospace,monospace;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-h:66px;
  color-scheme:dark;
}
:root[data-theme="light"]{--bg:#efefec;--text:#0e0e0e;--surface:#ffffff;--inc:#1a9c55;--exp:#d93a2b;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000000;--text:#f2f2f2}}
:root[data-theme="dark"]{--bg:#000000;--text:#f2f2f2}

*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0 auto;max-width:560px;width:100%;
  display:flex;flex-direction:column;overflow:hidden;
  font-family:var(--sans);font-size:15px;line-height:1.35;
  background-image:radial-gradient(color-mix(in srgb,var(--text) 11%,transparent) 1px,transparent 1.4px);
  background-size:16px 16px;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
#hdr{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.logo{font-family:var(--dot);font-weight:900;font-size:28px;letter-spacing:.03em}
.lvl{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 5px}
.lvl .n{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--dot);font-weight:900;font-size:18px}
.lc{display:flex;flex-direction:column;gap:5px}
.lvl .xp{font:500 10px var(--mono);color:var(--muted)}
.lvl .bar{display:block;width:64px;height:5px;border-radius:9px;background:var(--surface2);overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* main */
main{flex:1;overflow-y:auto;padding:6px 16px 110px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);background:var(--bg);border-top:1px solid var(--line)}
nav button{background:none;border:0;color:var(--muted);font:500 11px var(--mono);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--text)}
nav button.on::before{content:'';position:absolute;top:-1px;width:28px;height:2px;background:var(--accent);border-radius:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px}
.lbl{font:500 11px var(--mono);letter-spacing:.04em;color:var(--muted)}
.big{font-family:var(--dot);font-weight:900;font-size:42px;line-height:1.05;margin-top:4px}
.v{font:700 15px var(--mono);margin-top:3px}
.s{font:400 12px var(--mono);color:var(--muted);margin-top:3px}
.t{font-weight:600}
.pos{color:var(--inc)} .neg{color:var(--exp)}
.acc{color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.sec{margin:24px 4px 0;display:flex;justify-content:space-between;align-items:center}
.list{display:block}
.grow{flex:1;min-width:0}
.tag{font:500 9px var(--mono);border:1px solid var(--line);border-radius:6px;padding:1px 5px;color:var(--muted);margin-left:6px}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h .m{font-family:var(--dot);font-weight:900;font-size:22px;letter-spacing:.03em}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center;padding:0;flex:none}
.ib svg{width:18px;height:18px}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wk span{font:500 11px var(--mono);color:var(--muted);text-align:center;padding:4px 0}
.d{aspect-ratio:1/1.05;border:0;background:none;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:500 15px var(--mono);padding:0}
.d.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.d.sel{background:var(--text);color:var(--bg)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dots i.t{background:currentColor;opacity:.75}
.dots i.d0{background:none;box-shadow:inset 0 0 0 1px var(--accent)}
.dots i.t.d0{box-shadow:inset 0 0 0 1px currentColor}
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;margin:22px 4px 2px}
.dh{font-family:var(--dot);font-weight:900;font-size:22px}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-top:8px;cursor:pointer}
.row:active{background:var(--surface2)}
.chk{width:30px;height:30px;flex:none;border-radius:50%;border:1.5px solid var(--muted);background:none;color:transparent;display:grid;place-items:center;padding:0;transition:background .2s,border-color .2s}
.chk svg{width:16px;height:16px;stroke-width:2.6}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pop .35s}
.row.done .t{opacity:.5}
.row.task.done .t{text-decoration:line-through}
.amt{font:700 14px var(--mono);white-space:nowrap}
.dcol{width:34px;text-align:center;flex:none;line-height:1}
.dcol b{font:900 22px var(--dot);display:block}
.dcol span{font:500 10px var(--mono);color:var(--muted)}
.empty{margin-top:34px;text-align:center;color:var(--muted);font:500 12px var(--mono)}
.empty .dd{font:900 30px var(--dot);letter-spacing:.2em;margin-bottom:8px}

.jobs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:13px;text-align:left;min-height:64px}
.job.add{border-style:dashed;background:none;color:var(--muted);display:grid;place-items:center}
.job.add svg{width:22px;height:22px}
.jr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font:400 13px var(--mono)}
.jr:first-child{border-top:0}

/* controls */
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px;margin-bottom:6px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:9px 10px;border-radius:999px;font:500 13px var(--mono)}
.seg button.on{background:var(--text);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:none;padding:9px 15px;border-radius:999px;font:500 13px var(--sans)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.inp{width:100%;background:var(--surface2);border:1.5px solid transparent;color:var(--text);border-radius:16px;padding:13px 14px;font:16px var(--sans);outline:none;min-width:0}
.inp:focus{border-color:var(--accent)}
.inp.bad{border-color:var(--exp);animation:shake .4s}
textarea.inp{resize:none;line-height:1.45}
.fld{margin-top:14px}
.fld>.lbl{margin-bottom:6px}
.btns{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:14px 18px;font:600 14px var(--sans);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.btn.armed{background:var(--exp);color:#fff;border-color:var(--exp)}
.btn.sm{flex:none;padding:9px 16px;font-size:13px}
.switch{width:54px;height:32px;border-radius:99px;background:var(--surface2);position:relative;border:0;padding:0;flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:left .2s,background .2s}
.switch.on{background:var(--accent)}
.switch.on::after{left:26px;background:var(--accent-ink)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.total .big{font-size:34px;margin:0}
.hp{height:10px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:10px}
.hp i{display:block;height:100%;background:var(--accent);border-radius:9px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.cb{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;margin-top:10px;font:400 13px var(--mono)}
.cb .hp{margin:0;height:8px}
.boss{margin-top:10px}
.boss.dead{opacity:.55}
.boss .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
.boss .top .amt{font-size:16px}
.boss .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
.addrow{display:grid;grid-template-columns:1fr 92px 46px;gap:8px;align-items:center;padding:12px}
.addrow .ib{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);width:46px;height:46px}
.note .t{margin-bottom:4px}
.note .pv{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.note{margin-top:10px;cursor:pointer}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s}
.sh{position:absolute;left:0;right:0;margin:0 auto;bottom:0;width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-bottom:0;border-radius:30px 30px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.9,.2,1);overscroll-behavior:contain}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sh-title{font:900 26px var(--dot);margin:2px 0 6px}
.sh .inp{background:var(--surface2)}
.stat{margin-top:14px}
.srow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;font-weight:600}
.seg10{display:flex;gap:3px}
.seg10 i{flex:1;height:9px;border-radius:3px;background:var(--surface2)}
.seg10 i.f{background:var(--accent)}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px var(--line)}
.sw.on{border-color:var(--text)}
.crow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
input[type=color]{width:48px;height:34px;border:0;background:none;padding:0;border-radius:8px}
.profhead{display:flex;align-items:center;gap:16px;margin-top:6px}
.profhead .n{font:900 64px var(--dot);color:var(--accent);line-height:1}

.fab{position:fixed;right:max(18px,calc(50% - 280px + 18px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px);width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 28px color-mix(in srgb,var(--accent) 45%,transparent);z-index:20;transition:transform .15s;padding:0}
.fab:active{transform:scale(.9)}
.fab svg{width:27px;height:27px;stroke-width:2}

.xpf{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:100;font:900 22px var(--dot);color:var(--accent);pointer-events:none;animation:floatxp 1.7s ease-out forwards;white-space:nowrap;text-shadow:0 0 18px color-mix(in srgb,var(--accent) 55%,transparent)}
.lu{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--bg) 92%,transparent);display:grid;place-items:center;text-align:center;animation:fade .3s;background-image:radial-gradient(color-mix(in srgb,var(--accent) 35%,transparent) 1.2px,transparent 1.6px);background-size:14px 14px}
.lu .n{font:900 140px/1 var(--dot);color:var(--accent);animation:lvl .6s cubic-bezier(.2,1.4,.4,1)}
.lu .ttl{font:900 28px var(--dot);margin-top:6px}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:88%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 90px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font:500 13px var(--mono);z-index:120;animation:rise .3s both;pointer-events:none}

.sy{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:8px;vertical-align:middle;background:none;box-shadow:inset 0 0 0 1.5px var(--muted);transition:background .3s}
.sy.ok{background:var(--inc);box-shadow:none}
.sy.pending{background:var(--muted);box-shadow:none}
.sy.err{background:var(--exp);box-shadow:none}
.ur{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.ur .ud{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.ur.soon .ud{background:var(--accent)}
.ur.late .ud{background:var(--exp)}
.ur .s{margin:0;white-space:nowrap}
.ur.soon .s{color:var(--accent)}
.ur.late .s{color:var(--exp)}
.up .lbl{margin-bottom:6px}
.card .row{background:var(--surface2);border-color:transparent}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes lvl{from{opacity:0;transform:scale(.6)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes floatxp{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-80px)}}
.enter>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}
.enter>*:nth-child(3){animation-delay:.1s}
.enter>*:nth-child(4){animation-delay:.15s}
.enter>*:nth-child(n+5){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="view"></main>
<button class="fab" id="fab" data-act="fab" aria-label="Добавить"></button>
<nav>
  <button data-act="tab" data-tab="home" class="on"><span class="ic" data-i="home"></span>Главная</button>
  <button data-act="tab" data-tab="shifts"><span class="ic" data-i="shifts"></span>Смены</button>
  <button data-act="tab" data-tab="money"><span class="ic" data-i="money"></span>Деньги</button>
  <button data-act="tab" data-tab="shop"><span class="ic" data-i="shop"></span>Покупки</button>
  <button data-act="tab" data-tab="notes"><span class="ic" data-i="notes"></span>Заметки</button>
</nav>
<div id="sheet"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})};

/* ---------- иконки ---------- */
var IC={
  home:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  shifts:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  money:'<path d="M9 20V4h4.5a3.5 3.5 0 010 7H9M6 15h8"/>',
  shop:'<path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/>',
  notes:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  l:'<path d="M15 6l-6 6 6 6"/>',
  r:'<path d="M9 6l6 6-6 6"/>',
  chk:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'
};
function ic(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}
document.querySelectorAll('[data-i]').forEach(function(e){e.innerHTML=ic(e.dataset.i);e.style.display='grid'});
$('#fab').innerHTML=ic('plus');

/* ---------- утилиты ---------- */
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parseYmd=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
var today=function(){return ymd(new Date())};
var mkey=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)};
var firstOf=function(d){return new Date(d.getFullYear(),d.getMonth(),1)};
var addMonth=function(d,n){return new Date(d.getFullYear(),d.getMonth()+n,1)};
var daysBetween=function(a,b){return Math.round((parseYmd(b)-parseYmd(a))/864e5)};
var MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
var MONG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var WD=['вс','пн','вт','ср','чт','пт','сб'];
var fmtDay=function(s){var d=parseYmd(s);return WD[d.getDay()]+', '+d.getDate()+' '+MONG[d.getMonth()]};
var dd=function(s){return s.slice(8)+'.'+s.slice(5,7)};
var nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
var r2=function(x){return Math.round((x+Number.EPSILON)*100)/100};
var money=function(n){return nf.format(r2(n))+' ₽'};
var hrs=function(h){return nf.format(r2(h))+' ч'};
var num=function(v){var x=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(x)?x:0};
var sum=function(a){return a.reduce(function(x,y){return x+y},0)};
var groupBy=function(a,k){var o={};a.forEach(function(x){(o[x[k]]=o[x[k]]||[]).push(x)});return o};
var tmin=function(t){if(!t)return null;var p=t.split(':').map(Number);return p[0]*60+p[1]};
function spanH(f,t){var a=tmin(f),b=tmin(t);if(a==null||b==null)return 0;var d=b-a;if(d<0)d+=1440;return d/60}
var earned=function(s){return s.kind==='fixed'?num(s.rate):num(s.paid)*num(s.rate)};
var buzz=function(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}};
var cmpShift=function(a,b){return a.date.localeCompare(b.date)||(a.from||'').localeCompare(b.from||'')};

/* ---------- данные ---------- */
/* Пользовательское локальное хранилище: разные Telegram-аккаунты на одном устройстве не видят данные друг друга. */
var TG=(window.Telegram&&window.Telegram.WebApp)||null;
var TGUSER=(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user)||null;
var TGID=TGUSER&&TGUSER.id?String(TGUSER.id):'';

function lum(hex){
  var c=hex.replace('#','');
  var r=parseInt(c.substr(0,2),16)/255,g=parseInt(c.substr(2,2),16)/255,b=parseInt(c.substr(4,2),16)/255;
  var f=function(x){return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)};
  return .2126*f(r)+.7152*f(g)+.0722*f(b);
}
function applyColors(){
  var r=document.documentElement,c=S.settings.colors||{},light=S.settings.theme==='light';
  r.dataset.theme=light?'light':'dark';
  ['accent','bg','surface','inc','exp'].forEach(function(k){
    if(c[k])r.style.setProperty('--'+k,c[k]);else r.style.removeProperty('--'+k);
  });
  r.style.setProperty('--accent-ink',lum(c.accent||'#ff3b3b')>.42?'#0b0b0b':'#ffffff');
  if(c.bg){
    var lightBg=lum(c.bg)>.4;
    r.style.setProperty('--text',lightBg?'#0e0e0e':'#f2f2f2');
    r.style.colorScheme=lightBg?'light':'dark';
  }else{r.style.removeProperty('--text');r.style.removeProperty('color-scheme')}
  $('#tc').setAttribute('content',c.bg||(light?'#efefec':'#000000'));
  if(TG){try{TG.setBackgroundColor(c.bg||(light?'#efefec':'#000000'));TG.setHeaderColor(c.bg||(light?'#efefec':'#000000'))}catch(e){}}
}

  var p=S.player,t=today(),bonus=0,before=lvlOf(p.xp);

/* ---------- облако (Telegram CloudStorage) ---------- */
var CH=3800;
var CLOUD={on:false,state:'off',timer:null,busy:false,dirty:false,ready:false,want:false,last:{},n:0};
function syncText(){
  if(CLOUD.state==='ok')return 'Данные сохраняются в облаке этого бота и доступны на любом устройстве, где открыт этот чат. Копию всё равно делай иногда.';
  if(CLOUD.state==='pending')return 'Сохраняю в облако…';
  if(CLOUD.state==='err')return 'Облако сейчас недоступно, данные пока только на этом устройстве. Повторю попытку при следующем изменении.';
  return 'Открой приложение из Telegram, чтобы данные сохранялись в облаке бота. Пока они только в этом браузере.';
}
function setSync(st){
  if(st)CLOUD.state=st;
  var el=$('#sy');if(el)el.className='sy '+(CLOUD.state==='off'?'':CLOUD.state);
  var t=$('#synctxt');if(t)t.textContent=syncText();
}
function chunkStr(str){
  var out=[],i=0;
  while(i<str.length){
    var j=Math.min(i+CH,str.length);
    if(j<str.length){var c=str.charCodeAt(j-1);if(c>=0xD800&&c<=0xDBFF)j--}
    out.push(str.slice(i,j));i=j;
  }
  return out.length?out:[''];
}
function sheetOpen(){return $('#sheet').classList.contains('open')}
function tgCall(fn){return new Promise(function(res,rej){fn(function(err,val){if(err)rej(new Error(err));else res(val)})})}
function csSet(k,v){return tgCall(function(cb){TG.CloudStorage.setItem(k,v,cb)})}
function csGetKeys(){return tgCall(function(cb){TG.CloudStorage.getKeys(cb)})}
function csGetItems(keys){return tgCall(function(cb){TG.CloudStorage.getItems(keys,cb)})}
function csRemove(keys){return tgCall(function(cb){TG.CloudStorage.removeItems?TG.CloudStorage.removeItems(keys,cb):TG.CloudStorage.removeItem(keys[0],cb)})}
async function pullCloud(){
  var keys=await csGetKeys();
  if(keys.indexOf(CK_META)===-1){CLOUD.n=0;return 'empty'}
  var vals=await csGetItems([CK_META]);
  var meta;try{meta=JSON.parse(vals[CK_META])}catch(e){CLOUD.n=0;return 'empty'}
  CLOUD.n=+meta.n||0;
  var newer=(+meta.ts||0)>(S.ts||0)||FRESH;
  if(!newer){if((S.ts||0)>(+meta.ts||0))CLOUD.want=true;return 'local'}
  if(sheetOpen())return 'busy';
  var ids=[];for(var i=0;i<CLOUD.n;i++)ids.push(cid(i));
  var chunks=await csGetItems(ids),parts=[],k;
  for(i=0;i<CLOUD.n;i++){
    k=cid(i);
    if(typeof chunks[k]!=='string'||!chunks[k])throw new Error('missing chunk');
    parts.push(chunks[k]);CLOUD.last[k]=chunks[k];
  }
  S=normalize(JSON.parse(parts.join('')));S.ts=+meta.ts||0;FRESH=false;
  localSave();applyColors();updateHeader();render();
  return 'cloud';
}
function scheduleSync(){
  if(!CLOUD.on)return;
  if(!CLOUD.ready){CLOUD.want=true;return}
  clearTimeout(CLOUD.timer);
  CLOUD.timer=setTimeout(pushCloud,1500);
  if(CLOUD.state!=='pending')setSync('pending');
}
async function pushCloud(){
  if(!CLOUD.on)return;
  if(CLOUD.busy){CLOUD.dirty=true;return}
  CLOUD.busy=true;
  var ts=S.ts,failed=false;
  try{
    var ch=chunkStr(JSON.stringify(S)),i;
    if(ch.length>1023)throw new Error('too big');
    for(i=0;i<ch.length;i++){
      var id=cid(i);
      if(CLOUD.last[id]!==ch[i]){await csSet(id,ch[i]);CLOUD.last[id]=ch[i]}
    }
    if(ch.length<CLOUD.n){
      var rm=[];for(i=ch.length;i<CLOUD.n;i++){rm.push(cid(i));delete CLOUD.last[cid(i)]}
      await csRemove(rm);
    }
    await csSet(CK_META,JSON.stringify({ts:ts,n:ch.length}));
    CLOUD.n=ch.length;
    setSync('ok');
  }catch(e){failed=true;setSync('err')}
  CLOUD.busy=false;
  if(CLOUD.dirty||S.ts!==ts){CLOUD.dirty=false;scheduleSync()}
  else if(failed)setTimeout(scheduleSync,30000);
}
async function initCloud(){
  try{
    if(!TG||!TG.CloudStorage||!TG.initData)return;
    CLOUD.on=true;
    setSync('pending');
    var r,tries=0;
    for(;tries<20;tries++){
      r=await pullCloud();
      if(r!=='busy')break;
      await new Promise(function(res2){setTimeout(res2,3000)});
    }
    if(r==='busy')throw new Error('busy');
    CLOUD.ready=true;
    if(CLOUD.want||r==='empty'){CLOUD.want=false;scheduleSync()}else setSync('ok');
  }catch(e){setSync(CLOUD.on?'err':'off')}
}

function upcomingHtml(){
  var now=new Date(),td=today(),tm=ymd(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1)),nm=now.getHours()*60+now.getMinutes(),out=[];
  var at=function(date,time){var off=date===td?0:(date===tm?1440:null);if(off==null)return null;return off+(time?tmin(time):(date===td?1439:0))};
  var when=function(date,time,diff){
    if(time){if(diff<0)return['late','время прошло'];if(diff<=60)return['soon','через '+diff+' мин'];return['',(date===td?'сегодня ':'завтра ')+time]}
    return['',date===td?'сегодня':'завтра'];
  };
  S.tasks.forEach(function(t){
    if(t.done)return;
    if(t.date<td){if(daysBetween(t.date,td)<=30)out.push({o:-3e5,c:'late',title:t.title,when:'просрочено · '+dd(t.date),act:'editTask',id:t.id});return}
    var a=at(t.date,t.time);if(a==null)return;
    var w=when(t.date,t.time,a-nm);
    out.push({o:w[0]==='late'?a-2e5:a,c:w[0],title:t.title,when:w[1],act:'editTask',id:t.id});
  });
  S.shifts.forEach(function(s){
    if(s.done)return;
    if(s.date<td){if(daysBetween(s.date,td)<=14)out.push({o:-4e5,c:'late',title:s.jobName+': отметь смену',when:dd(s.date),act:'editShift',id:s.id});return}
    var a=at(s.date,s.from);if(a==null)return;
    var w=when(s.date,s.from,a-nm);
    out.push({o:w[0]==='late'?a-2e5:a,c:w[0],title:s.jobName+' · смена',when:w[1],act:'editShift',id:s.id});
  });
  var ym=mkey(now);
  S.rec.forEach(function(r){
    if(!recActive(r,ym)||(r.paid&&r.paid[ym]))return;
    var n=daysBetween(td,recDue(r,ym));if(n>3)return;
    out.push({o:n<0?-1e5+n:n*1440+2000,c:n<0?'late':(n<=1?'soon':''),title:r.title+' · '+money(r.amount),when:n<0?'просрочено '+(-n)+' дн.':(n===0?'сегодня':'через '+n+' дн.'),act:'editRec',id:r.id});
  });
  if(!out.length)return '';
  out.sort(function(a,b){return a.o-b.o});
  return '<div class="card up" style="margin-bottom:12px"><div class="lbl">ближайшее</div>'
    +out.slice(0,5).map(function(x){return '<div class="ur '+x.c+'" data-act="'+x.act+'" data-id="'+x.id+'"><span class="ud"></span><span class="grow t" style="font-weight:500">'+esc(x.title)+'</span><span class="s">'+esc(x.when)+'</span></div>'}).join('')+'</div>';
}

    +recCard(k)+catHtml+'<div class="list">'+(rows||empty('Операций нет'))+'</div>';

function debtInfo(d){
  var paid=sum(d.pays.map(function(p){return p.amount}));
  return{paid:paid,left:Math.max(0,d.total-paid),pct:d.total?Math.min(1,paid/d.total):1};
}
function bossCard(d){
  var i=debtInfo(d),dead=i.left<=0;
  return '<div class="card boss'+(dead?' dead':'')+'" data-act="debt" data-id="'+d.id+'" style="cursor:pointer">'
    +'<div class="lbl">'+(dead?'долг закрыт':(d.dir==='owe_me'?'должен мне':'я должен'))+'</div>'
    +'<div class="top"><div class="t">'+esc(d.person)+'</div><div class="amt">'+(dead?'0 ₽':money(i.left))+'</div></div>'
    +'<div class="hp"><i style="width:'+Math.round((1-i.pct)*100)+'%"></i></div>'
    +'<div class="foot"><div class="s">возвращено '+money(i.paid)+' из '+money(d.total)+'</div>'
    +(dead?'':'<button class="btn sm pri" data-act="pay" data-id="'+d.id+'">Внести возврат</button>')+'</div></div>';
}
function debtsHtml(){
  var act=S.debts.filter(function(d){return debtInfo(d).left>0}),dead=S.debts.filter(function(d){return debtInfo(d).left<=0});
  var mine=act.filter(function(d){return d.dir==='owe_me'}),ours=act.filter(function(d){return d.dir==='i_owe'});
  var sec=function(t,a){return a.length?'<div class="sec"><span class="lbl">'+t+' · '+money(sum(a.map(function(d){return debtInfo(d).left})))+'</span></div>'+a.map(bossCard).join(''):''};
  var out=sec('мне должны',mine)+sec('я должен',ours);
  if(dead.length)out+='<div class="sec"><span class="lbl">закрытые</span></div>'+dead.map(bossCard).join('');
  return out||empty('Долгов нет. Добавь через +');
}
function vShop(){

function goalCard(g){
  var pct=g.target?Math.min(1,g.saved/g.target):1,ready=g.saved>=g.target&&!g.done;
  var lbl=g.done?(g.kind==='wish'?'куплено':'достигнуто'):(g.kind==='wish'?'хочу купить':'копим');
  return '<div class="card boss'+(g.done?' dead':'')+'" data-act="editGoal" data-id="'+g.id+'" style="cursor:pointer">'
    +'<div class="lbl">'+lbl+(g.deadline&&!g.done?' · до '+dd(g.deadline):'')+'</div>'
    +'<div class="top"><div class="t">'+esc(g.title)+'</div><div class="amt">'+money(g.saved)+' / '+money(g.target)+'</div></div>'
    +'<div class="hp"><i style="width:'+Math.round(pct*100)+'%"></i></div>'
    +'<div class="foot"><div class="s">'+(g.done?'':(ready?'нужная сумма собрана':'осталось '+money(Math.max(0,g.target-g.saved))))+'</div>'
    +(g.done?'':(ready?'<button class="btn sm pri" data-act="goalDone" data-id="'+g.id+'">'+(g.kind==='wish'?'Куплено':'Готово')+'</button>':'<button class="btn sm pri" data-act="addSaved" data-id="'+g.id+'">Отложить</button>'))+'</div></div>';
}
function goalsHtml(){
  var act=S.goals.filter(function(g){return !g.done}),done=S.goals.filter(function(g){return g.done});

var SWATCH=['#ff3b3b','#ff8a00','#ffd60a','#3ddc84','#00c2ff','#4d6bff','#b26bff','#ff5fa2','#f2f2f2'];
function profileSheet(){
  var p=S.player,i=lvlInfo(p.xp),c=S.settings.colors||{},light=S.settings.theme==='light';
  var eff={accent:c.accent||'#ff3b3b',bg:c.bg||(light?'#efefec':'#000000'),surface:c.surface||(light?'#ffffff':'#121212'),inc:c.inc||(light?'#1a9c55':'#3ddc84'),exp:c.exp||(light?'#d93a2b':'#ff7a6e')};
  var stats=[['labor','Труд'],['disc','Дисциплина'],['wealth','Богатство']].map(function(a){
    var v=p.stats[a[0]]||0,l=Math.floor(Math.sqrt(v/30))+1,lo=30*(l-1)*(l-1),hi=30*l*l,f=Math.round((v-lo)/(hi-lo)*10),bars='';
    for(var k=0;k<10;k++)bars+='<i class="'+(k<f?'f':'')+'"></i>';

  }).join('');

    +'<div class="fld"><div class="lbl">Акцент</div><div class="chips" id="swatches">'+sw+'</div></div>'
    +'<div style="margin-top:12px">'+crow('accent','Свой акцент')+crow('bg','Фон')+crow('surface','Карточки')+crow('inc','Доход')+crow('exp','Расход')+'</div>'
    +'<div class="btns" style="margin-top:14px"><button class="btn ghost" data-act="resetColors">Сбросить цвета</button></div>'
    +'<div class="sec" style="margin-top:28px"><span class="lbl">данные</span></div>'
    +'<div class="s" id="synctxt" style="font-family:var(--sans);font-size:13px;margin-top:8px">'+esc(syncText())+'</div>'
    +'<textarea id="bk" class="inp" rows="3" placeholder="Сюда вставь копию для восстановления" style="margin-top:10px;font-size:13px"></textarea>'
    +'<div class="btns" style="margin-top:10px"><button class="btn" data-act="exportData">Скопировать копию</button><button class="btn" data-act="importData">Восстановить</button></div>'

    render();
  },
  mode:function(el){U.mode=el.dataset.m;render(true)},
  fab:function(){
    if(U.tab==='home')chooseSheet();

    else if(U.tab==='money')(U.mode==='ops'?txSheet():debtSheet());

    else if(U.tab==='shop')goalSheet();

  closeSheet:function(){closeSheet()},
  profile:function(){profileSheet()},
  newTask:function(){taskSheet(null,U.sel)},
  newShift:function(){shiftSheet(null,U.sel)},

  /* задачи */
  toggleTask:function(el){
    var t=S.tasks.find(function(x){return x.id===el.dataset.id});if(!t)return;
    t.done=!t.done;var first=t.done&&!t.xpGiven;if(first)t.xpGiven=true;
    save();render();buzz(10);
    if(first)award(10,'disc','Задача');
  },
  editTask:function(el){taskSheet(el.dataset.id)},

    if(e.id){var t=S.tasks.find(function(x){return x.id===e.id});t.title=title;t.date=date;t.time=time}
    else S.tasks.push({id:uid(),title:title,date:date,time:time,done:false});
    save();closeSheet();U.sel=date;
    var d=parseYmd(date);U.month=firstOf(d);render();

  newJob:function(){jobSheet()},

    U.edit.kind=el.dataset.v;
    document.querySelectorAll('#kindseg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===U.edit.kind)});
    $('#j_ratelbl').textContent=U.edit.kind==='fixed'?'Оплата за смену, ₽':'Ставка, ₽ в час';
  },
  saveJob:function(){
    var name=$('#j_name').value.trim();if(!name)return bad('j_name');
    var rate=num($('#j_rate').value);if(!(rate>0))return bad('j_rate');
    var e=U.edit,obj={name:name,kind:e.kind,rate:rate,from:$('#j_from').value,to:$('#j_to').value};
    if(e.id){
      var j=jobById(e.id);Object.assign(j,obj);
      S.shifts.forEach(function(s){if(s.jobId===j.id)s.jobName=name});
    }else S.jobs.push(Object.assign({id:uid()},obj));
    save();closeSheet();
    var a=U.afterJob;U.afterJob=null;
    render();
    if(a)shiftSheet(null,a);
  },
  delJob:function(el){confirm2(el,'Точно удалить?',function(){S.jobs=S.jobs.filter(function(x){return x.id!==U.edit.id});save();closeSheet();render()})},

  /* смены */
  toggleShift:function(el){
    var s=S.shifts.find(function(x){return x.id===el.dataset.id});if(!s)return;
    if(!s.done&&s.kind!=='fixed'&&!(num(s.paid)>0)){toast('Сначала укажи часы в смене');shiftSheet(s.id);return}
    s.done=!s.done;var first=s.done&&!s.xpGiven;if(first)s.xpGiven=true;

  },

    document.querySelectorAll('#jobchips .chip').forEach(function(c){c.classList.toggle('on',c.dataset.id===j.id)});
    $('#f_rate').value=j.rate;

  },
  tglDone:function(el){U.edit.done=!U.edit.done;el.classList.toggle('on',U.edit.done);buzz(8)},
  saveShift:function(){

    else{s=Object.assign({id:uid()},obj);S.shifts.push(s)}

    U.sel=date;U.month=firstOf(parseYmd(date));U.smonth=firstOf(parseYmd(date));

    if(first)award(25+Math.round(num(s.paid)*4),'labor','Смена');

    noteSheet(id);
  },
  delNote:function(el){confirm2(el,'Точно удалить?',function(){var id=U.edit.id;S.notes=S.notes.filter(function(x){return x.id!==id});save();closeSheet();render()})},

  /* платежи */
  newRec:function(){recSheet()},
  editRec:function(el){recSheet(el.dataset.id)},
  tglPaidNow:function(el){U.edit.paidNow=!U.edit.paidNow;el.classList.toggle('on',U.edit.paidNow)},
  recToggle:function(el){
    var r=S.rec.find(function(x){return x.id===el.dataset.id}),ym=el.dataset.ym;if(!r)return;
    r.paid=r.paid||{};
    if(r.paid[ym]){
      var old=r.paid[ym];delete r.paid[ym];
      S.tx=S.tx.filter(function(x){return x.id!==old});
      save();render();buzz(10);return;
    }
    var tid=uid();
    S.tx.push({id:tid,type:r.type,amount:r.amount,cat:r.cat,date:today(),note:r.title,recId:r.id,ym:ym});
    r.paid[ym]=tid;save();render();buzz(10);
    award(8,'disc',r.type==='income'?'Доход':'Платёж');
  },
  saveRec:function(){
    var title=$('#r_title').value.trim();if(!title)return bad('r_title');
    var amt=num($('#r_amt').value);if(!(amt>0))return bad('r_amt');
    var day=Math.round(num($('#r_day').value));if(day<1||day>31)return bad('r_day');
    var e=U.edit,obj={title:title,amount:amt,day:day,type:e.type,cat:e.cat||'Другое'};
    if(e.id)Object.assign(S.rec.find(function(x){return x.id===e.id}),obj);
    else{
      var r=Object.assign({id:uid(),from:mkey(new Date()),paid:{}},obj);
      if(e.paidNow)r.paid[r.from]='manual';
      S.rec.push(r);
    }
    save();closeSheet();render();
  },
  delRec:function(el){confirm2(el,'Точно удалить?',function(){S.rec=S.rec.filter(function(x){return x.id!==U.edit.id});save();closeSheet();render()})},

  /* цели */
  shopMode:function(el){U.shopMode=el.dataset.m;render(true)},
  editGoal:function(el){goalSheet(el.dataset.id)},
  goalKind:function(el){
    U.edit.kind=el.dataset.v;
    document.querySelectorAll('#gkindseg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===U.edit.kind)});
    $('#g_tl').textContent=U.edit.kind==='wish'?'Цена, ₽':'Сколько нужно, ₽';
  },
  saveGoal:function(){
    var title=$('#g_title').value.trim();if(!title)return bad('g_title');
    var target=num($('#g_target').value);if(!(target>0))return bad('g_target');
    var e=U.edit,obj={kind:e.kind,title:title,target:target,saved:Math.max(0,num($('#g_saved').value)),deadline:$('#g_dl').value,note:$('#g_note').value.trim()};
    if(e.id)Object.assign(S.goals.find(function(x){return x.id===e.id}),obj);
    else S.goals.push(Object.assign({id:uid(),done:false},obj));
    save();closeSheet();U.tab='shop';U.shopMode='goals';render(true);
  },
  delGoal:function(el){confirm2(el,'Точно удалить?',function(){S.goals=S.goals.filter(function(x){return x.id!==U.edit.id});save();closeSheet();render()})},
  addSaved:function(el){contribSheet(el.dataset.id)},
  saveContrib:function(){
    var amt=num($('#c_amt').value);if(!(amt>0))return bad('c_amt');
    var g=S.goals.find(function(x){return x.id===U.edit.id});if(!g)return;
    g.saved+=amt;save();closeSheet();render();
    txAward();
    if(g.saved>=g.target)toast('Нужная сумма собрана');
  },
  goalDone:function(el){
    var id=el.dataset.id||(U.edit&&U.edit.id),g=S.goals.find(function(x){return x.id===id});
    if(!g||g.done)return;
    g.done=true;
    if(g.kind==='wish'&&g.target>0){
      S.tx.push({id:uid(),type:'expense',amount:g.target,cat:'Покупки',date:today(),note:g.title,goalId:g.id});
      toast('Покупка записана в расходы');
    }
    var first=!g.xpGiven;g.xpGiven=true;
    save();
    if(sheetOpen())closeSheet();
    render();
    if(first)award(50,'wealth',g.kind==='wish'?'Куплено':'Цель');
  },
  saveFile:function(){
    function fallback(){
      try{
        var blob=new Blob([JSON.stringify(S)],{type:'application/json'});
        var url=URL.createObjectURL(blob);
        var a=document.createElement('a');a.href=url;a.download='ritm-backup-'+today()+'.json';
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(url)},2000);
        toast('Файл сохранён');
      }catch(e){toast('Не удалось сохранить файл')}
    }
    if(window.claude&&window.claude.use){
      window.claude.use('downloads').then(function(d){
        if(!d)return fallback();
        d.save({filename:'ritm-backup-'+today()+'.json',data:JSON.stringify(S)}).then(function(){toast('Файл сохранён')},fallback);
      },fallback);
    }else fallback();
  },
  loadFile:function(){var i=$('#fileload');if(i&&i.click)i.click()},

  /* профиль */
  setTheme:function(el){
    S.settings.theme=el.dataset.v;applyColors();save();
    document.querySelectorAll('#themeseg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===S.settings.theme)});
  },
  setAccent:function(el){
    S.settings.colors.accent=el.dataset.c;applyColors();save();
    document.querySelectorAll('#swatches .sw').forEach(function(b){b.classList.toggle('on',b.dataset.c===el.dataset.c)});
    var ci=document.querySelector('[data-color="accent"]');if(ci)ci.value=el.dataset.c;
  },
  resetColors:function(){S.settings.colors={};applyColors();save();profileSheet()},
  exportData:function(){
    var ta=$('#bk');ta.value=JSON.stringify(S);ta.focus();ta.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    if(ok){toast('Копия скопирована');return}
    try{navigator.clipboard.writeText(ta.value).then(function(){toast('Копия скопирована')},function(){toast('Выдели текст в поле и скопируй')})}
    catch(e){toast('Выдели текст в поле и скопируй')}
  },
  importData:function(el){
    confirm2(el,'Заменить данные?',function(){
      try{
        var o=JSON.parse($('#bk').value);
        if(!o||!Array.isArray(o.jobs)||!Array.isArray(o.shifts))throw new Error('bad');
        S=normalize(o);save();applyColors();updateHeader();closeSheet();render(true);toast('Данные восстановлены');
      }catch(e){toast('Это не похоже на копию')}
    });
  },
  resetAll:function(el){
    confirm2(el,'Точно стереть всё?',function(){
      S=defState();save();applyColors();updateHeader();closeSheet();render(true);toast('Всё стёрто');
    });
  }
};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var h=ACT[el.dataset.act];if(h)h(el,e);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.color){
    S.settings.colors[t.dataset.color]=t.value;applyColors();save();
    if(t.dataset.color==='accent')document.querySelectorAll('#swatches .sw').forEach(function(b){b.classList.remove('on')});
    return;
  }
  var L=t.dataset.live;if(!L||!U.edit)return;
  if(L==='paid'){U.edit.pm=true;shiftCalc()}
  else if(L==='shift'){autoPaid();shiftCalc()}
  else if(L==='rate'){shiftCalc()}
  else if(L==='note'){
    var n=S.notes.find(function(x){return x.id===U.edit.id});
    if(n){n.title=$('#n_title').value;n.text=$('#n_text').value;n.upd=Date.now();save()}
  }
});
document.addEventListener('change',function(e){
  if(e.target.id!=='fileload')return;
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var o=JSON.parse(reader.result);
      if(!o||!Array.isArray(o.jobs)||!Array.isArray(o.shifts))throw new Error('bad');
      S=normalize(o);save();applyColors();updateHeader();closeSheet();render(true);toast('Данные восстановлены');
    }catch(err){toast('Это не похоже на копию')}
  };
  reader.readAsText(f);
  e.target.value='';
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&(e.target.id==='sh_name'||e.target.id==='sh_price')){e.preventDefault();ACT.shopAdd()}
});

applyColors();
initHeader();
render(true);
if(TG){
  try{
    TG.ready();TG.expand();
    if(TG.BackButton)TG.BackButton.onClick(function(){if(sheetOpen())closeSheet()});
    if(TG.enableClosingConfirmation)TG.enableClosingConfirmation();
  }catch(e){}
}
initCloud();
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  if(CLOUD.on&&CLOUD.ready&&!CLOUD.busy){pullCloud().then(function(){if(!sheetOpen())render()},function(){})}
  else if(!sheetOpen())render();
});
setInterval(function(){if(U.tab==='home'&&!sheetOpen()&&!document.hidden)render()},60000);
})();
</script>
</body>
</html>
